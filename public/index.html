function feed(el, qs, empty) {
  if (el.nextElementSibling?.classList.contains('sent')) el.nextElementSibling.remove();
  const fid = (el._fid = {}); // switching profile tabs invalidates any in-flight load
  let before = '', done = false, busy = false;
  const s = document.createElement('div'); s.className = 'sent min-h-[6rem]'; s.innerHTML = skel; el.after(s);
  const more = async () => {
    if (busy || done) return; busy = true; if (before) s.innerHTML = skel;
    try {
      const ps = await api(`/posts?${qs}${before ? '&before=' + encodeURIComponent(before) : ''}`);
      if (el._fid !== fid) return;
      el.insertAdjacentHTML('beforeend', ps.map(card).join(''));
      if (ps.length < 20) { done = true; s.innerHTML = el.children.length ? '' : `<p class="p-10 text-center text-zinc-500">${empty}</p>`; } else { before = ps.at(-1).feedAt; s.innerHTML = ''; }
    } catch (x) { done = true; s.innerHTML = `<p class="p-8 text-center text-red-400">${esc(x.message)}</p>`; }
    busy = false;
  };
  new IntersectionObserver((e) => e[0].isIntersecting && more(), { rootMargin: '600px' }).observe(s);
}

      return api(`/posts/${id}/repost`, { method: 'POST' });
    }
    if (d.m) { const id = b.closest('[data-pid]').dataset.pid; dlg.close(); if (d.m === 'copy') { navigator.clipboard?.writeText(location.href.split('#')[0] + '#/p/' + id); return toast('Link copied'); } if (d.m === 'report') return setTimeout(() => reportDlg('post', id), 250);
      if (d.m === 'edit') return setTimeout(() => openDlg(`<form id="edf" data-id="${id}" class="space-y-3 p-4"><h2 class="text-xl font-extrabold">Edit post</h2><textarea name="text" maxlength="280" rows="4" class="${inp}">${esc(P[id].text)}</textarea><p class="err text-sm text-red-400"></p><div class="flex justify-end"><button class="rounded-full bg-white px-5 py-2 font-bold text-black">Save</button></div></form>`), 250);
      if (d.m === 'pin') { const r = await api('/posts/' + id + '/pin', { method: 'POST' }); me.pinned = r.pinned ? id : null; localStorage.me = JSON.stringify(me); toast(r.pinned ? 'Pinned to your profile' : 'Unpinned'); const k = '#/u/' + me.username; drop(k); if (cur === k) { cur = null; route(); } return; }
      if (d.m === 'muteu' || d.m === 'blocku') return relate(d.m === 'muteu' ? 'mute' : 'block', P[id].author.username);
      return del(id); }
    if (d.rep) { await api('/report', { method: 'POST', body: JSON.stringify({ kind: d.k, target: d.t, reason: d.rep }) }); dlg.close(); return toast('Thanks, we’ll review your report'); }
    if (d.repuser) {
      if (!me) return openAuth();
      const un = d.un; return openDlg(`<div class="p-2">${[['mute', d.muted === '1' ? `Unmute @${un}` : `Mute @${un}`], ['block', d.blocked === '1' ? `Unblock @${un}` : `Block @${un}`], ['report', `Report @${un}`]].map(([m, t]) => `<button data-um="${m}" data-un="${un}" data-uid2="${d.repuser}" class="block w-full rounded-xl px-4 py-3 text-left font-semibold hover:bg-zinc-900 ${m === 'report' ? '' : 'text-red-400'}">${t}</button>`).join('')}</div>`);
    }
    if (d.um) { dlg.close(); if (d.um === 'report') return setTimeout(() => reportDlg('user', d.uid2), 250); return relate(d.um, d.un); }
    if (d.block) return relate('block', d.block);
    if (d.ptab) { const v = b.closest('.pg'); v.querySelector('.ptabs').innerHTML = ptabs(v.dataset.uid, d.ptab); const f = v.querySelector('.f'); f.innerHTML = ''; return feed(f, `feed=${d.ptab}:${v.dataset.user}`, PE[d.ptab]); }
    if ('delacct' in d) { if (!confirm('Delete your account and all your posts forever?')) return; await api('/me', { method: 'DELETE' }); localStorage.clear(); location.hash = '#/'; return location.reload(); }
    if (d.ra) { const row = b.closest('[data-rid]'); await api('/admin/reports/' + row.dataset.rid, { method: 'POST', body: JSON.stringify({ action: d.ra }) }); collapse(row); return toast('Done'); }
    if ('ban' in d) { const row = b.closest('[data-uid]'), on = d.banned !== '1'; await api('/admin/users/' + row.dataset.uid, { method: 'POST', body: JSON.stringify({ banned: on }) }); b.dataset.banned = on ? '1' : '0'; b.textContent = on ? 'Unban' : 'Ban'; return toast(on ? 'User banned' : 'User unbanned'); }
    if (d.stopf) { await api('/admin/fake/stop', { method: 'POST', body: JSON.stringify({ type: d.stopf, id: d.stopid, kind: d.stopkind }) }); toast('Stopped — frozen at the current number'); return loadActive(); }
    if ('login' in d) return openAuth();
    if ('need' in d) { e.preventDefault(); return openAuth(); }
    if (b?.getAttribute('href') === '#/' && cur === '#/') return scrollTo({ top: 0, behavior: 'smooth' });
    if ('back' in d) return history.length > 1 ? history.back() : (location.hash = '#/');
    if ('sw' in d) { reg = !reg; return openAuth(); }
    if ('out' in d) { localStorage.clear(); location.hash = '#/'; return location.reload(); }
    if ('compose' in d) return me ? openDlg(`<div class="p-2">${composer()}</div>`) : openAuth();
    if ('edit' in d) return openDlg(`<form id="ef" class="space-y-3 p-6"><h2 class="text-2xl font-extrabold">Edit profile</h2><input name="name" maxlength="30" value="${esc(me.name)}" placeholder="Name" class="${inp}"><textarea name="bio" maxlength="160" rows="3" placeholder="Bio" class="${inp}">${esc(me.bio)}</textarea><label class="block text-sm text-zinc-400">Profile photo<input name="avatar" type="file" accept="image/*" class="mt-1 block w-full text-sm"></label><label class="block text-sm text-zinc-400">Banner<input name="banner" type="file" accept="image/*" class="mt-1 block w-full text-sm"></label><p class="err text-sm text-red-400"></p><button class="w-full rounded-full bg-white py-2.5 font-bold text-black">Save</button></form>`);
    if (d.tab) { if (d.tab === 'following' && !me) return openAuth(); tab = d.tab; scrollTo(0, 0); return home(pages[cur].el, pages[cur]); }
    if (b?.classList.contains('sub')) return submit(b.closest('.cmp'));
    if (d.follow) { if (!me) return openAuth(); const r = await api(`/users/${d.follow}/follow`, { method: 'POST' }); b.outerHTML = fbtn(d.follow, r.isFollowing); return; }
    if (d.act) {
      if (!me) return openAuth();
      const id = art.dataset.id, p = P[id];
      if (d.act === 'repost') return openDlg(`<div class="p-2" data-pid="${id}"><button data-rq="toggle" class="block w-full rounded-xl px-4 py-3 text-left font-semibold hover:bg-zinc-900">${p.reposted ? 'Undo repost' : 'Repost'}</button><button data-rq="quote" class="block w-full rounded-xl px-4 py-3 text-left font-semibold hover:bg-zinc-900">Quote</button></div>`);
      if (d.act === 'reply' && p.canReply === false) return toast(replyMsg(p), 1);
      if (d.act === 'reply') { b.classList.add('a-reply'); return setTimeout(() => openDlg(`<div class="p-2">${composer(id)}</div>`), 200); }
      if (d.act === 'more') return openDlg(`<div class="p-2" data-pid="${id}">${[['copy', 'Copy link'], ...(me.id === p.author?.id && !p.repostBy && Date.now() - new Date(p.at) < 3600e3 ? [['edit', 'Edit post']] : []), ...(me.id === p.author?.id && !p.reply && !p.repostBy ? [['pin', me.pinned === id ? 'Unpin from profile' : 'Pin to profile']] : []), ...(me.id !== p.author?.id ? [['muteu', `Mute @${p.author?.username}`], ['blocku', `Block @${p.author?.username}`]] : []), ['report', 'Report post'], ...(me.id === p.author?.id || me.admin ? [['del', 'Delete post']] : [])].map(([m, t]) => `<button data-m="${m}" class="block w-full rounded-xl px-4 py-3 text-left font-semibold hover:bg-zinc-900 ${m === 'del' ? 'text-red-500' : ''}${m === 'muteu' || m === 'blocku' ? 'text-red-400' : ''}">${t}</button>`).join('')}</div>`);
      if (d.act === 'del') { if (!confirm('Delete this post?')) return; await api('/posts/' + id, { method: 'DELETE' }); art.style.cssText = 'opacity:0;transform:translateX(24px);transition:.25s'; return setTimeout(() => document.querySelectorAll(`article[data-id="${id}"]`).forEach((a) => a.remove()), 250); }
      const [k, n] = { like: ['liked', 'likes'], repost: ['reposted', 'reposts'], bookmark: ['bookmarked', 'saves'] }[d.act];
      p[k] = !p[k]; if (n) p[n] += p[k] ? 1 : -1; rerender(id); if (p[k]) document.querySelectorAll(`article[data-id="${id}"] [data-act="${d.act}"]`).forEach((x) => x.classList.add('a-' + d.act)); if (d.act === 'bookmark') drop('#/bookmarks');
      return api(`/posts/${id}/${d.act}`, { method: 'POST' });
    }
    if (art && !e.target.closest('a,button')) location.hash = '#/p/' + art.dataset.id;
  } catch (x) { toast(x.message, 1); }
});
document.addEventListener('submit', async (e) => {
  e.preventDefault(); const f = e.target, body = JSON.stringify(Object.fromEntries(new FormData(f)));
  try {
    if (f.id === 'af') { const d = await api('/auth/' + (reg ? 'register' : 'login'), { method: 'POST', body }); localStorage.token = d.token; localStorage.me = JSON.stringify(d.user); location.reload(); }
    if (f.id === 'edf') { const id = f.dataset.id, o = P[id], np = await api('/posts/' + id, { method: 'PATCH', body }); P[id] = { ...np, pinned: o.pinned, repostBy: o.repostBy }; dlg.close(); rerender(id); toast('Post updated'); }
    if (f.id === 'pf') { await api('/me/password', { method: 'POST', body }); f.reset(); toast('Password updated'); }
    if (f.id === 'ef') { me = (await api('/me', { method: 'PATCH', body: new FormData(f) })).user; localStorage.me = JSON.stringify(me); dlg.close(); chrome(); Object.keys(pages).forEach(drop); cur = null; route(); toast('Profile saved'); }
    if (f.id === 'ffForm') {
      await api('/admin/fake/followers', { method: 'POST', body: JSON.stringify({ amount: f.amount.value, mode: f.ff_mode.value, until: f.ff_until.value }) });
      toast('Follower boost applied'); f.reset(); loadActive();
      if (cur?.startsWith('#/u/')) { drop(cur); route(); }
    }
    if (f.id === 'peForm') {
      const pid = pidOf(f.post.value); let applied = false, err = '';
      for (const k of ['likes', 'reposts', 'saves']) {
        const amt = f[k + '_amount'].value; if (!amt) continue;
        try { await api('/admin/fake/engagement', { method: 'POST', body: JSON.stringify({ postId: pid, kind: k, amount: amt, mode: f[k + '_mode'].value, until: f[k + '_until'].value }) }); applied = true; }
        catch (x) { err = x.message; }
      }
      if (err) f.querySelector('.err').textContent = err;
      else if (!applied) f.querySelector('.err').textContent = 'Enter an amount for at least one metric';
      else { toast('Post boosted'); f.reset(); loadActive(); }
    }
    if (f.id === 'frForm') {
      await api('/admin/fake/replies', { method: 'POST', body: JSON.stringify({ postId: pidOf(f.post.value), messages: f.messages.value, count: f.count.value, mode: f.fr_mode.value, until: f.fr_until.value }) });
      toast('Fake replies created'); f.reset(); loadActive();
    }
  } catch (x) { f.querySelector('.err').textContent = x.message; }
});
let mnT;
document.addEventListener('input', (e) => {
  const c = e.target.closest('.cmp'); if (!c) return;
  if (e.target.tagName === 'TEXTAREA') {
    const ta = e.target, n = 280 - ta.value.length, ct = c.querySelector('.ct'), box = c.querySelector('.mn');
    ct.textContent = n; ct.classList.toggle('text-red-400', n < 20);
    const m = ta.value.slice(0, ta.selectionStart).match(/(^|\s)@(\w{1,15})$/); clearTimeout(mnT);
    if (!m) return box.classList.add('hidden');
    mnT = setTimeout(async () => {
      try { const us = await api('/mentions?q=' + m[2]); box.innerHTML = us.map((u, i) => `<button type="button" data-mn="${esc(u.username)}" class="flex w-full items-center gap-2 px-3 py-2 text-left hover:bg-zinc-900 ${i ? '' : 'bg-zinc-900'}">${dot(u)}<span class="min-w-0 truncate"><b>${esc(u.name)}</b> <span class="text-zinc-500">@${esc(u.username)}</span></span></button>`).join(''); box.classList.toggle('hidden', !us.length); } catch {}
    }, 150);
  }
  if (e.target.matches('[data-sched]')) c.querySelector('.sub').textContent = e.target.value ? 'Schedule' : 'Post';
});
document.addEventListener('change', async (e) => {
  const c = e.target.closest('.cmp'); if (!c || e.target.type !== 'file') return;
  const list = [...e.target.files].filter((f) => f.type.startsWith('image/')); e.target.value = '';
  if (!list.length) return;
  togglePoll(c, false); delete c.dataset.gif; c._files = c._files || [];
  for (const f of list) {
    if (c._files.length >= 4) { toast('You can add up to 4 images', 1); break; }
    const file = await compress(f); c._files.push({ file, url: URL.createObjectURL(file) });
  }
  renderPv(c);
});
document.addEventListener('change', (e) => { const s = e.target.closest('[data-badge]'); if (s) api('/admin/users/' + s.closest('[data-uid]').dataset.uid, { method: 'POST', body: JSON.stringify({ badge: s.value }) }).then(() => toast('Badge updated')).catch((x) => toast(x.message, 1)); });
let gtm; document.addEventListener('input', (e) => { if (e.target.id === 'gq') { clearTimeout(gtm); gtm = setTimeout(() => gifs(e.target.value), 400); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && (e.target.id === 'sq' || e.target.classList.contains('sq')) && e.target.value.trim()) location.hash = '#/search/' + encodeURIComponent(e.target.value.trim()); });
document.addEventListener('keydown', (e) => { // arrow/enter/tab/esc through @mention suggestions
  const c = e.target.closest?.('.cmp'), box = c?.querySelector('.mn');
  if (!box || box.classList.contains('hidden') || e.target.tagName !== 'TEXTAREA') return;
  const items = [...box.children]; let i = items.findIndex((x) => x.classList.contains('bg-zinc-900'));
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); items[i]?.classList.remove('bg-zinc-900'); i = (i + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items[i].classList.add('bg-zinc-900'); }
  else if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); pickMention(c, items[Math.max(i, 0)].dataset.mn); }
  else if (e.key === 'Escape') { e.preventDefault(); box.classList.add('hidden'); }
});
// Closing the composer dialog with unsent text keeps it as a draft
dlg.addEventListener('close', () => {
  const c = dlg.querySelector('.cmp'); if (!c || !me || c.dataset.sent || c.dataset.parent || c.dataset.quote) return;
  const t = c.querySelector('textarea').value.trim(), id = c.dataset.draft; if (!t) return;
  c.dataset.sent = '1';
  api(id ? '/drafts/' + id : '/drafts', { method: id ? 'PUT' : 'POST', body: JSON.stringify({ text: t }) }).then(() => toast('Saved to drafts')).catch(() => {});
});
addEventListener('hashchange', () => { chrome(); route(); });
chrome(); route(); sugg(); trend();
if (token) { pollUnread(); setInterval(pollUnread, 10000); }
if (token) api('/me').then((d) => { me = d.user; localStorage.me = JSON.stringify(me); chrome(); }).catch(() => {});

// Caps at 3 significant digits like X does: "37.1K" (2-digit + decimal) but "371K" (3-digit, no decimal) — a decimal only shows below 100 in its tier.
function fmt(n) {

  const neg = n < 0 ? '-' : '', abs = Math.abs(n), tiers = [[1e9, 'B'], [1e6, 'M'], [1e3, 'K']];

function feed(el, qs, empty) {
  if (el.nextElementSibling?.classList.contains('sent')) el.nextElementSibling.remove();
  const fid = (el._fid = {}); // switching profile tabs invalidates any in-flight load
  let before = '', done = false, busy = false;
  const s = document.createElement('div'); s.className = 'sent min-h-[6rem]'; s.innerHTML = skel; el.after(s);
  const more = async () => {
    if (busy || done) return; busy = true; if (before) s.innerHTML = skel;
    try {
      const ps = await api(`/posts?${qs}${before ? '&before=' + encodeURIComponent(before) : ''}`);
      if (el._fid !== fid) return;
      const shown = ps.filter((p) => !muted(p));
      el.insertAdjacentHTML('beforeend', shown.map(card).join(''));
      if (ps.length < 20) { done = true; s.innerHTML = el.children.length ? '' : `<p class="p-10 text-center text-zinc-500">${empty}</p>`; } else { before = ps.at(-1).feedAt; s.innerHTML = ''; if (!shown.length) { busy = false; return more(); } }
    } catch (x) { done = true; s.innerHTML = `<p class="p-8 text-center text-red-400">${esc(x.message)}</p>`; }
    busy = false;
  };
  new IntersectionObserver((e) => e[0].isIntersecting && more(), { rootMargin: '600px' }).observe(s);
}

// Counts a view when a post stays mostly on screen for a moment (once per post per session; your own posts don't count)
const seenV = new Set(JSON.parse(sessionStorage.seenV || '[]')), vq = new Set(), vt = new Map();
const vobs = new IntersectionObserver((es) => es.forEach((e) => {
  const id = e.target.dataset.id;
  if (e.isIntersecting) { if (!seenV.has(id) && !vt.has(id)) vt.set(id, setTimeout(() => { vt.delete(id); seenV.add(id); vq.add(id); }, 700)); }
  else if (vt.has(id)) { clearTimeout(vt.get(id)); vt.delete(id); }
}), { threshold: 0.6 });
new MutationObserver(() => document.querySelectorAll('article[data-id]:not([data-vo])').forEach((a) => { a.dataset.vo = 1; vobs.observe(a); })).observe($('#view'), { childList: true, subtree: true });
async function flushViews(keep) {

  try { await api('/views', { method: 'POST', body: JSON.stringify({ ids }), keepalive: !!keep }); } catch {}
}
setInterval(() => flushViews(), 6000); document.addEventListener('visibilitychange', () => document.hidden && flushViews(true));
